name: Build and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      SDK_IMAGE: andi97/pocketbook-dev-docker:6.8-b300-r1

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run unit tests
        run: make test

      # OpenSSL, curl and c-ares are cross-built from source; the pinned
      # versions live in the Makefile, so its hash is the cache key.
      - name: Cache cross-built dependencies
        uses: actions/cache@v4
        with:
          path: |
            third_party/prefix
            third_party/stamps
          key: deps-${{ env.SDK_IMAGE }}-${{ hashFiles('Makefile') }}

      - name: Build with PocketBook SDK 6.8 B300
        run: |
          docker pull "$SDK_IMAGE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project \
            "$SDK_IMAGE" \
            -lc 'export LD_LIBRARY_PATH="$SDK_BASE/usr/lib"; make clean; make -j"$(nproc)" SDK_PATH="$SDK_BASE/usr"'

      - name: Validate application binary
        run: |
          test -s OPDSClient.app

          file_output="$(file OPDSClient.app)"
          echo "$file_output"
          grep -q 'ELF 32-bit.*ARM' <<<"$file_output"

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project:ro" \
            -w /project \
            "$SDK_IMAGE" \
            -lc '
              set -euo pipefail
              export LD_LIBRARY_PATH="$SDK_BASE/usr/lib"
              readelf="$SDK_BASE/usr/bin/arm-obreey-linux-gnueabi-readelf"
              header="$("$readelf" -h OPDSClient.app)"
              echo "$header"
              grep -q "Machine:.*ARM" <<<"$header"
              grep -q "Version5 EABI, soft-float ABI" <<<"$header"

              # Only libinkview and glibc may remain dynamic; anything else is a
              # firmware-version dependency the app is not allowed to acquire.
              needed="$("$readelf" -d OPDSClient.app | sed -n "s/.*NEEDED.*\[\(.*\)\]/\1/p")"
              echo "$needed"
              unexpected="$(grep -vE "^(libinkview\.so|lib(c|m|dl|pthread|rt)\.so\.[0-9]+)$" <<<"$needed" || true)"
              if [ -n "$unexpected" ]; then
                echo "Unexpected dynamic dependencies: $unexpected" >&2
                exit 1
              fi
            '

      - name: Create release identifier
        id: release
        run: |
          timestamp="$(date -u +'%Y%m%d-%H%M%S')"
          short_sha="$(git rev-parse --short=7 HEAD)"
          release_id="build-${timestamp}-${short_sha}"
          echo "id=$release_id" >> "$GITHUB_OUTPUT"
          echo "title=PocketBook OPDS Client ${timestamp}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Package application
        run: |
          tar -czf OPDSClient.tar.gz OPDSClient.app
          test -s OPDSClient.tar.gz
          tar -tzf OPDSClient.tar.gz | grep -qx 'OPDSClient.app'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          gh release create "$RELEASE_ID" \
            OPDSClient.tar.gz \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --generate-notes
